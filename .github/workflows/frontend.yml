name: Frontend - Azure Static Web Apps

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["client/**"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://blogapp-api-25292.azurewebsites.net/api

      # Pull requests are only checked; deploys happen on pushes to main.
      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: client/dist
          output_location: ""
          skip_app_build: true

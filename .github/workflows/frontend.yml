name: Frontend - Azure Static Web Apps

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["client/**"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://blogapp-api-25292.azurewebsites.net/api

      # Fails fast with a clear message if the secret is missing or is the wrong value.
      - name: Check deployment token secret
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret AZURE_STATIC_WEB_APPS_API_TOKEN is missing or empty."
            exit 1
          fi
          if [[ "$TOKEN" == *"<publishData"* ]]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN contains the App Service publish profile. Paste the Static Web Apps deployment token instead."
            exit 1
          fi
          if [[ "$TOKEN" =~ [[:space:]] ]]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN contains spaces or line breaks. Re-copy it without extra characters."
            exit 1
          fi
          echo "Deployment token is present (${#TOKEN} characters)."

      # Pull requests are only checked; deploys happen on pushes to main.
      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: client/dist
          output_location: ""
          skip_app_build: true

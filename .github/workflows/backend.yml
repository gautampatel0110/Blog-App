name: Backend - Azure App Service

on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [main]
    paths: ["server/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Fails fast with a clear message if the secret is missing or is the wrong value.
      - name: Check publish profile secret
        env:
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::Secret AZURE_WEBAPP_PUBLISH_PROFILE is missing or empty."
            exit 1
          fi
          if [[ "$PROFILE" != *"<publishData"* ]]; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE is not a publish profile (it must start with <publishData>). It may contain the Static Web Apps token instead."
            exit 1
          fi
          if [[ "$PROFILE" != *"blogapp-api-25292.scm.azurewebsites.net"* ]]; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE belongs to a different web app, or basic auth publishing was disabled when it was downloaded."
            exit 1
          fi
          echo "Publish profile looks valid."

      - uses: actions/checkout@v5

      # Ship the source only; App Service (SCM_DO_BUILD_DURING_DEPLOYMENT=true)
      # runs npm install + npm run build on the server, as it does today.
      - name: Package server source
        run: cd server && zip -r ../server.zip . -x "node_modules/*" "dist/*" ".env"

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: blogapp-api-25292
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: server.zip
